<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>#MadeRealHere QR Code</title>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1530; color: #fff; font-family: Ubuntu, system-ui, sans-serif; padding: 24px 16px; box-sizing: border-box; }
    .card { background: #fff; color: #0b1530; border-radius: 24px; padding: 28px; text-align: center; width: 100%; max-width: 380px; box-sizing: border-box; }
    h1 { margin: 0 0 4px; font-size: 32px; } h1 span { color: #0070ad; }
    p { margin: 0 0 18px; color: #3b4a6b; }
    #qr svg { width: 100%; height: auto; display: block; }
    .url { font-size: 12px; color: #6b7894; word-break: break-all; margin-top: 12px; }
    .row { display: flex; gap: 8px; margin-top: 18px; }
    button { flex: 1; min-height: 44px; border-radius: 999px; border: 0; background: #12abdb; color: #04122b; font: inherit; font-weight: 700; cursor: pointer; }
    button.alt { background: #e6eef7; }
    @media print { body { background: #fff; } .row { display: none; } }
  </style>
</head>
<body>
  <div class="card">
    <h1>#Made<span>Real</span>Here</h1>
    <p>Scan to step into the stories</p>
    <div id="qr"></div>
    <div class="url" id="url"></div>
    <div class="row">
      <button id="png">Download PNG</button>
      <button id="print" class="alt">Print</button>
    </div>
  </div>
  <script src="vendor/qrcode.js"></script>
  <script>
    // Points at index.html next to this page. Override with ?url=https://...
    const target = new URLSearchParams(location.search).get("url") || new URL("./", location.href).href;
    document.getElementById("url").textContent = target;
    const qr = qrcode(0, "H");
    qr.addData(target);
    qr.make();
    document.getElementById("qr").innerHTML = qr.createSvgTag({ cellSize: 8, margin: 2, scalable: true });
    document.getElementById("print").onclick = () => print();
    document.getElementById("png").onclick = () => {
      const n = qr.getModuleCount(), cell = 24, m = 4 * cell, size = n * cell + m * 2;
      const c = document.createElement("canvas"); c.width = c.height = size;
      const x = c.getContext("2d");
      x.fillStyle = "#fff"; x.fillRect(0, 0, size, size);
      x.fillStyle = "#0b1530";
      for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (qr.isDark(r, k)) x.fillRect(m + k * cell, m + r * cell, cell, cell);
      const a = document.createElement("a"); a.download = "maderealhere-qr.png"; a.href = c.toDataURL("image/png"); a.click();
    };
  </script>
</body>
</html>
